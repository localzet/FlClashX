name: Проверки UserNet

on:
  pull_request:
  push:
    branches: [main, 'codex/usernet-mobile-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: usernet-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --no-pub test
